<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deutsch mit Alex</title>
    <style>
        :root {
            --bg-main: #ffffff;
            --bg-card: #f8fafc;
            --border-color: #e2e8f0;
            --text-main: #0f172a;
            --text-muted: #475569;
            --primary: #2563eb;
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--bg-main);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        header {
            background: #ffffff;
            border-bottom: 1px solid var(--border-color);
            padding: 10px 16px;
            flex-shrink: 0;
        }

        .header-inner {
            max-width: 700px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 1.15rem;
            font-weight: 700;
        }

        .coffee-mini {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-decoration: none;
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
        }

        .coffee-mini:hover {
            color: var(--primary);
            border-color: var(--primary);
        }

        /* Navigation */
        .nav-bar {
            display: flex;
            background: #ffffff;
            border-bottom: 1px solid var(--border-color);
            padding: 6px 12px;
            gap: 6px;
            overflow-x: auto;
            flex-shrink: 0;
        }

        .tab-btn {
            background: transparent;
            border: none;
            padding: 8px 14px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            border-radius: 8px;
            white-space: nowrap;
        }

        .tab-btn.active {
            background: var(--bg-card);
            color: var(--primary);
        }

        /* Content Bereich mit iframe */
        .content {
            flex: 1;
            overflow: hidden;
        }

        .content iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

<header>
    <div class="header-inner">
        <h1>Deutsch mit Alex</h1>
        <a href="https://www.paypal.com/paypalme/XanderFox" target="_blank" class="coffee-mini">
            ☕ Kaffee spendieren
        </a>
    </div>
</header>

<nav class="nav-bar">
    <button class="tab-btn active" onclick="loadPage('ueber-mich.html', this)">Über mich</button>
    <button class="tab-btn" onclick="loadPage('uebungen.html', this)">Übungen</button>
    <button class="tab-btn" onclick="loadPage('kompass.html', this)">Kompass</button>
    <button class="tab-btn" onclick="loadPage('materialien.html', this)">Material</button>
</nav>

<div class="content">
    <iframe id="contentFrame" src="ueber-mich.html" title="Inhalt"></iframe>
</div>

<script>
    function loadPage(page, btn) {
        document.getElementById('contentFrame').src = page;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }
</script>

</body>
</html>
