<!DOCTYPE html>
<html lang="de">
<head>

    <title>Deutsch lernen – Lernmaterial</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #222;
            text-align: center;
            padding: 40px 20px;
        }

        .card {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.1);
        }

        h1 {
            color: #1f4e79;
        }

        .button {
            display: inline-block;
            margin-top: 20px;
            padding: 14px 24px;
            background: #1f8a70;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
        }

        .button:hover {
            background: #146b56;
        }

        img {
            max-width: 100%;
            border-radius: 12px;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <div class="card">
        <h1>Deutsch lernen 🇩🇪</h1>

        <p>
            Hier findest du eine Lernübersicht mit wichtigen

        </p>

        <img
            src="Bilder2/9C6B2BCE-2AE7-486A-B0F0-D62D1D3701EA.png"

        >

        <br>

        <a
            class="button"
            href="Bilder2/9C6B2BCE-2AE7-486A-B0F0-D62D1D3701EA.png"

        >
