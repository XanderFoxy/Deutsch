<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deutsch mit Alex</title>
    <style>
        :root {
            --bg-main: #f8fafc;
            --bg-header: #ffffff;
            --border-color: #e2e8f0;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --primary: #2563eb;
            --primary-soft: #dbeafe;
            --accent: #0ea5e9;
            --radius: 14px;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: linear-gradient(180deg, #f0f9ff 0%, #f8fafc 40%, #f1f5f9 100%);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        header {
            background: var(--bg-header);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 16px;
            flex-shrink: 0;
            box-shadow: var(--shadow);
        }

        .header-inner {
            max-width: 720px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: -0.3px;
        }

        .coffee-mini {
            font-size: 0.78rem;
            color: #b45309;
            text-decoration: none;
            padding: 5px 12px;
            border-radius: 20px;
            border: 1px solid #fde68a;
            background: #fffbeb;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .coffee-mini:hover {
            background: #fef3c7;
            border-color: #f59e0b;
        }

        /* Navigation */
        .nav-bar {
            display: flex;
            justify-content: center;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--border-color);
            padding: 8px 12px;
            gap: 6px;
            overflow-x: auto;
            flex-shrink: 0;
        }

        .tab-btn {
            background: transparent;
            border: none;
            padding: 9px 16px;
            font-size: 0.88rem;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            border-radius: 10px;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .tab-btn:hover {
            background: var(--primary-soft);
            color: var(--primary);
        }

        .tab-btn.active {
            background: var(--primary);
            color: white;
            box-shadow: 0 2px 8px rgba(37, 99, 235, 0.25);
        }

        /* Content */
        .content {
            flex: 1;
            overflow: hidden;
            padding: 12px;
            max-width: 740px;
            width: 100%;
            margin: 0 auto;
        }

        .content-frame-wrap {
            height: 100%;
            background: #ffffff;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            overflow: hidden;
        }

        .content iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* Kleiner Fuß-Hinweis */
        .footer-note {
            text-align: center;
            font-size: 0.72rem;
            color: var(--text-muted);
            padding: 6px;
            flex-shrink: 0;
        }
    </style>
</head>
<body>

<header>
    <div class="header-inner">
        <h1>Deutsch mit Alex</h1>
        <a href="https://www.paypal.com/paypalme/XanderFox" target="_blank" class="coffee-mini">
            ☕ Kaffee spendieren
        </a>
    </div>
</header>

<nav class="nav-bar">
    <button class="tab-btn active" onclick="loadPage('ueber-mich.html', this)">Über mich</button>
    <button class="tab-btn" onclick="loadPage('uebungen.html', this)">Übungen</button>
    <button class="tab-btn" onclick="loadPage('kompass.html', this)">Kompass</button>
    <button class="tab-btn" onclick="loadPage('materialien.html', this)">Material</button>
</nav>

<div class="content">
    <div class="content-frame-wrap">
        <iframe id="contentFrame" src="ueber-mich.html" title="Inhalt"></iframe>
    </div>
</div>

<div class="footer-note">Deutsch mit Alex · Modular & Klar</div>

<script>
    function loadPage(page, btn) {
        document.getElementById('contentFrame').src = page;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }
</script>

</body>
</html>
