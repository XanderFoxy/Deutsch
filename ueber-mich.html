<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Über mich – Deutsch mit Alex</title>
    <style>
        :root {
            --bg-main: #ffffff;
            --bg-card: #f8fafc;
            --border-color: #e2e8f0;
            --text-main: #0f172a;
            --text-muted: #475569;
            --primary: #2563eb;
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--bg-main);
            color: var(--text-main);
            line-height: 1.5;
            padding: 16px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        h1 {
            font-size: 1.3rem;
            margin-bottom: 16px;
        }

        .card {
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 20px;
        }

        .about-grid {
            display: flex;
            gap: 16px;
            align-items: flex-start;
        }

        .profile-img-wrap {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            overflow: hidden;
            flex-shrink: 0;
            border: 2px solid var(--border-color);
        }

        .profile-img-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .about-text p {
            font-size: 0.92rem;
            color: var(--text-muted);
            margin-bottom: 10px;
        }

        .links-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 18px;
        }

        .link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 11px;
            border-radius: 8px;
            color: var(--text-main);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .link-btn:hover {
            background: #f1f5f9;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Über mich</h1>

        <div class="card">
            <div class="about-grid">
                <div class="profile-img-wrap">
                    <img src="https://github.com/XanderFoxy/Deutsch/blob/main/Bilder2/9ob2nzt2.jpeg?raw=true" alt="Alex">
                </div>
                <div class="about-text">
                    <p>Ich bin Alex, 46 Jahre alt, und helfe dir dabei, die deutsche Sprache logisch, praxisnah und ohne unnötige Komplexität zu meistern.</p>
                    <p>Mein Ansatz: Klare Strukturen, echte Alltagsbeispiele und ein strukturierter Lernpfad, damit du sofort sicherer sprichst.</p>
                </div>
            </div>

            <div class="links-grid">
                <a href="https://m.youtube.com/playlist?list=PLza1DhjwP_bew29ZGGnpEuq-vgugL0dhR" target="_blank" class="link-btn">
                    YouTube
                </a>
                <a href="https://www.tiktok.com/@xander_fox_official" target="_blank" class="link-btn">
                    TikTok
                </a>
            </div>
        </div>
    </div>
</body>
</html>
