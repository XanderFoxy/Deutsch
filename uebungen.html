<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Übungen – Deutsch mit Alex</title>
<link rel="stylesheet" href="style.css">
<style>
body{padding:16px;background:#fff;font-family:system-ui,-apple-system,sans-serif;color:#0f172a}
.container{max-width:620px;margin:0 auto}
h1{font-size:1.3rem;color:#1e40af;margin-bottom:4px}
.subtitle{font-size:.9rem;color:#64748b;margin-bottom:14px}
.difficulty-bar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.diff-btn{flex:1;min-width:90px;padding:9px 12px;border-radius:8px;border:1px solid #e2e8f0;background:#f8fafc;font-weight:600;font-size:.85rem;cursor:pointer;color:#475569}
.diff-btn.active{background:#2563eb;color:#fff;border-color:#2563eb}
.controls{margin-bottom:16px}
.hint-toggle{font-size:.82rem;color:#475569;display:flex;align-items:center;gap:6px;cursor:pointer}
.quiz-card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:14px 16px;margin-bottom:14px}
.quiz-card.collapsed{display:none}
.quiz-card h2{font-size:1.02rem;color:#1e40af;margin-bottom:2px;display:flex;align-items:center;gap:8px}
.progress-info{font-size:.8rem;color:#64748b;margin-bottom:8px}
.quiz-sentence{font-size:.93rem;margin-bottom:12px;font-weight:500;line-height:1.5}
.blank-slot{display:inline-block;min-width:56px;border-bottom:2px solid #2563eb;text-align:center;color:#2563eb;font-weight:700;padding:0 4px}
.options-row{display:flex;gap:8px;flex-wrap:wrap}
.opt-choice{background:#fff;border:1px solid #e2e8f0;padding:8px 10px;border-radius:8px;font-size:.83rem;font-weight:600;cursor:pointer;flex:1 1 110px;text-align:center;line-height:1.3;word-break:break-word;min-height:40px;display:flex;align-items:center;justify-content:center}
.opt-choice:hover:not(:disabled){border-color:#2563eb;color:#2563eb}
.opt-choice:disabled{opacity:.92;cursor:default}
.opt-choice.correct{background:#d1fae5;border-color:#10b981;color:#065f46}
.opt-choice.wrong{background:#fee2e2;border-color:#ef4444;color:#991b1b}
.feedback-text{margin-top:8px;font-size:.86rem;font-weight:600}
.multi-hint{font-size:.78rem;color:#0369a1;margin-bottom:6px;display:none}
.multi-hint.show{display:block}
.card-actions{margin-top:8px}
.skip-btn{background:none;border:none;font-size:.78rem;cursor:pointer;color:#94a3b8;text-decoration:underline}
.skip-btn:hover{color:#475569}
.info-btn{font-size:.85rem;border:1px solid #cbd5e1;border-radius:50%;width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;color:#2563eb;background:#fff;cursor:pointer}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:100;align-items:center;justify-content:center;padding:16px}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:12px;padding:18px;max-width:420px;width:100%;max-height:80vh;overflow:auto}
.modal h3{margin:0 0 8px;color:#1e40af}
.modal p,.modal li{font-size:.88rem;color:#334155;line-height:1.45}
.modal ul{padding-left:18px;margin:6px 0}
.modal-close{margin-top:12px;background:#0f172a;color:#fff;border:none;padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600}
.score-box{background:#f0f9ff;border:1px solid #bae6fd;border-radius:12px;padding:16px;margin:20px 0 50px}
.score-box h2{font-size:1.08rem;color:#0369a1;margin-bottom:8px}
.score-line{display:flex;justify-content:space-between;font-size:.88rem;margin-bottom:5px;color:#334155}
.score-total{margin-top:10px;padding-top:8px;border-top:1px solid #bae6fd;font-weight:700}
.reward{margin-top:8px;font-size:1.05rem;font-weight:700;color:#1e40af}
.profile{margin-top:6px;font-size:.9rem;color:#0369a1}
.bonus-note{font-size:.8rem;color:#64748b}
#error-box{display:none;background:#fef2f2;border:1px solid #fecaca;color:#991b1b;padding:12px;border-radius:8px;margin-bottom:16px;font-size:.9rem}
</style>
</head>
<body>
<div class="container">
  <h1>Interaktives Training</h1>
  <p class="subtitle">9 Kategorien · Zufall ohne Wiederholung · faire Prozentwertung</p>
  <div id="error-box"></div>

  <div class="difficulty-bar">
    <button type="button" class="diff-btn active" data-level="leicht">Leicht (10)</button>
    <button type="button" class="diff-btn" data-level="mittel">Mittel (20)</button>
    <button type="button" class="diff-btn" data-level="schwer">Schwer (30)</button>
  </div>

  <div class="controls">
    <label class="hint-toggle">
      <input type="checkbox" id="multiHintToggle">
      Hinweis bei mehreren richtigen Antworten
    </label>
  </div>

  <div id="cards"></div>
  <div id="restore-area" style="margin-bottom:16px;font-size:.85rem;color:#64748b"></div>

  <div class="score-box">
    <h2>Deine Auswertung</h2>
    <div id="score-lines"></div>
    <div class="score-total">Gesamt: <span id="score-total">–</span></div>
    <div class="bonus-note" id="bonus-note"></div>
    <div class="reward" id="reward-text"></div>
    <div class="profile" id="profile-text"></div>
  </div>
</div>

<div class="modal-bg" id="modal">
  <div class="modal">
    <h3 id="modal-title"></h3>
    <div id="modal-body"></div>
    <button type="button" class="modal-close" id="modal-close">Schließen</button>
  </div>
</div>

<script>

    kw: "<p><b>kennen</b> = Personen, Orte, Dinge<br><b>wissen</b> = Fakten und Informationen</p>",
    ob: "<p><b>wenn</b> = Bedingung<br><b>ob</b> = Unsicherheit / indirekte Frage</p>",

        text: "Hier ist ein/eine ___.",

  function makeAlt() {
    var items = [
      { text: "Kannst du bitte die Tür ___?", correct: ["öffnen", "aufmachen"], all: ["öffnen", "aufmachen", "schließen"], hint: "öffnen = aufmachen" },

  // ========== LOGIK ==========
  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function getUniqueItem(pool, used) {
    var avail = [];
    var i;
    for (i = 0; i < pool.length; i++) {
      if (used.indexOf(i) === -1) avail.push(i);
    }
    if (!avail.length) {
      used.length = 0;
      for (i = 0; i < pool.length; i++) avail.push(i);
    }
    var idx = avail[Math.floor(Math.random() * avail.length)];
    used.push(idx);
    return pool[idx];
  }

  function showQuestion(type) {
    var st = state[type];
    if (st.collapsed) return;

    var pool = pools[type];
    var sentenceEl = document.getElementById(type + "-sentence");
    var optionsEl = document.getElementById(type + "-options");
    var fbEl = document.getElementById(type + "-fb");
    var progEl = document.getElementById(type + "-progress");
    var multiEl = document.getElementById(type + "-multi");

    if (st.index >= questionsPerRound) {
      st.finished = true;
      sentenceEl.innerHTML = "<strong>Fertig!</strong> " + st.correct + " richtig" + (st.bonus ? " (+" + st.bonus + " Bonus)" : "");
      optionsEl.innerHTML = "";
      fbEl.textContent = "";
      progEl.textContent = "Abgeschlossen · " + st.correct + "/" + questionsPerRound + (st.bonus ? " (+" + st.bonus + " Bonus)" : "");
      multiEl.classList.remove("show");
      updateScores();
      return;
    }

    var item = getUniqueItem(pool, st.used);
    var html = item.text;
    if (hasSlot[type]) {
      html = item.text.replace("___", "<span class=\"blank-slot\" id=\"" + type + "-slot\">_____</span>");
      sentenceEl.innerHTML = "Satz: „" + html + "“";
    } else {
      sentenceEl.textContent = item.text;
    }

    fbEl.textContent = "";
    progEl.textContent = "Frage " + (st.index + 1) + " / " + questionsPerRound + " · Richtig: " + st.correct + (st.bonus ? " (+" + st.bonus + " Bonus)" : "");

    if (showMultiHint && item.correct.length > 1) {
      multiEl.textContent = "Mehrere Antworten können richtig sein – finde möglichst alle.";
      multiEl.classList.add("show");
    } else {
      multiEl.classList.remove("show");
    }

    optionsEl.innerHTML = "";
    var isMulti = item.correct.length > 1;
    var selected = [];

    shuffle(item.all).forEach(function (opt) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "opt-choice";
      btn.textContent = opt;

      btn.onclick = function () {
        if (btn.disabled) return;

        if (isMulti) {
          if (selected.indexOf(opt) !== -1) return;
          selected.push(opt);
          var ok = item.correct.indexOf(opt) !== -1;
          btn.classList.add(ok ? "correct" : "wrong");
          btn.disabled = true;

          var foundAll = item.correct.every(function (c) { return selected.indexOf(c) !== -1; });
          var hasWrong = selected.some(function (s) { return item.correct.indexOf(s) === -1; });

          if (hasWrong) {
            Array.prototype.forEach.call(optionsEl.querySelectorAll("button"), function (b) {
              b.disabled = true;
              if (item.correct.indexOf(b.textContent) !== -1) b.classList.add("correct");
            });
            fbEl.style.color = "#e11d48";
            fbEl.textContent = "Falsch. Richtig: " + item.correct.join(", ");
            setTimeout(function () { st.index++; showQuestion(type); updateScores(); }, 1200);
          } else if (foundAll) {
            Array.prototype.forEach.call(optionsEl.querySelectorAll("button"), function (b) { b.disabled = true; });
            st.correct += 1;
            if (item.correct.length > 1) st.bonus += 1;
            fbEl.style.color = "#0d9488";
            fbEl.textContent = item.correct.length > 1 ? "Super! Alle gefunden (+1 Bonus)" : "Richtig!";
            setTimeout(function () { st.index++; showQuestion(type); updateScores(); }, 1000);
          }
        } else {
          Array.prototype.forEach.call(optionsEl.querySelectorAll("button"), function (b) { b.disabled = true; });
          var isOk = item.correct.indexOf(opt) !== -1;
          if (hasSlot[type]) {
            var slot = document.getElementById(type + "-slot");
            if (slot) {
              slot.textContent = opt;
              slot.style.color = isOk ? "#0d9488" : "#e11d48";
            }
          }
          btn.classList.add(isOk ? "correct" : "wrong");
          Array.prototype.forEach.call(optionsEl.querySelectorAll("button"), function (b) {
            if (item.correct.indexOf(b.textContent) !== -1) b.classList.add("correct");
          });
          fbEl.style.color = isOk ? "#0d9488" : "#e11d48";
          fbEl.textContent = isOk ? "Richtig!" : ("Falsch. Tipp: " + item.hint);
          if (isOk) st.correct++;
          setTimeout(function () { st.index++; showQuestion(type); updateScores(); }, 1000);
        }
      };
      optionsEl.appendChild(btn);
    });
  }

  function loadAll() {
    cats.forEach(function (c) {
      if (!state[c].collapsed) showQuestion(c);
    });
  }

  function setDifficulty(level) {
    difficulty = level;
    questionsPerRound = level === "leicht" ? 10 : level === "mittel" ? 20 : 30;
    document.querySelectorAll(".diff-btn").forEach(function (b) {
      b.classList.toggle("active", b.getAttribute("data-level") === level);
    });
    cats.forEach(function (c) {
      state[c] = {
        index: 0, correct: 0, bonus: 0, used: [],
        collapsed: state[c].collapsed, finished: false
      };
    });
    loadAll();
    updateScores();
    renderRestore();
  }

  function collapseCat(type) {
    state[type].collapsed = true;
    var card = document.getElementById("card-" + type);
    if (card) card.classList.add("collapsed");
    renderRestore();
    updateScores();
  }

  function expandCat(type) {
    state[type].collapsed = false;
    var card = document.getElementById("card-" + type);
    if (card) card.classList.remove("collapsed");
    if (state[type].index === 0 && !state[type].finished) showQuestion(type);
    renderRestore();
    updateScores();
  }

  function renderRestore() {
    var area = document.getElementById("restore-area");
    var collapsed = cats.filter(function (c) { return state[c].collapsed; });
    if (!collapsed.length) {
      area.innerHTML = "";
      return;
    }
    area.innerHTML = "Ausgeblendet: " + collapsed.map(function (c) {
      return "<button type=\"button\" class=\"skip-btn\" data-expand=\"" + c + "\">" + names[c] + " wieder einblenden</button>";
    }).join(" · ");
  }

  function getReward(p, b) {
    if (p >= 110 || (p >= 100 && b >= 5)) return "🦸 Deutsch-Superheld/in – außergewöhnlich!";
    if (p >= 100) return "🏆 Perfekt – fast schon Superheld!";
    if (p >= 92) return "⭐ Deutsch-Ass";
    if (p >= 85) return "💪 Sehr stark";
    if (p >= 75) return "👍 Solide Leistung";
    if (p >= 65) return "📚 Guter Fortschritt";
    if (p >= 50) return "🌱 Auf dem Weg";
    if (p >= 35) return "🧭 Orientierungsphase";
    if (p >= 20) return "☕️ Aufwärmen";
    return "🪴 Frischer Start – einfach weitermachen";
  }

  function getProfile(active, avg) {
    if (!active.length) return "";
    var set = {};
    active.forEach(function (c) { set[c] = true; });
    var labels = [];
    if ((set.ob || set.als || set.kw) && avg >= 70) labels.push("Logik-Fuchs");
    if ((set.art || set.plu || set.err) && avg >= 70) labels.push("Grammatik-Profi");
    if (set.tri && avg >= 70) labels.push("Deutschland-Kenner");
    if (set.red && avg >= 70) labels.push("Redewendungs-Profi");
    if (set.alt && avg >= 70) labels.push("Wortschatz-Flexer");
    if (labels.length >= 3 && avg >= 80) return "🌟 Allrounder – flexibel in mehreren Bereichen";
    if (!labels.length) return "🎯 Fokus-Lerner – du arbeitest gezielt an dem, was du gewählt hast";
    return "Profil: " + labels.join(" · ");
  }

  function updateScores() {
    var lines = document.getElementById("score-lines");
    lines.innerHTML = "";
    var totalCorrect = 0, totalPossible = 0, totalBonus = 0;
    var active = [];

    cats.forEach(function (c) {
      var st = state[c];
      if (st.collapsed) return;
      if (st.index === 0 && !st.finished) return;
      active.push(c);
      var bonusStr = st.bonus ? " (+" + st.bonus + " Bonus)" : "";
      var percent = Math.round(((st.correct + st.bonus) / questionsPerRound) * 100);
      lines.innerHTML += "<div class=\"score-line\"><span>" + names[c] + "</span><span>" + st.correct + "/" + questionsPerRound + bonusStr + " · " + percent + "%</span></div>";
      totalCorrect += st.correct + st.bonus;
      totalPossible += questionsPerRound;
      totalBonus += st.bonus;
    });

    if (!totalPossible) {
      document.getElementById("score-total").textContent = "–";
      document.getElementById("bonus-note").textContent = "";
      document.getElementById("reward-text").textContent = "";
      document.getElementById("profile-text").textContent = "";
      return;
    }

    var totalPercent = Math.round((totalCorrect / totalPossible) * 100);
    document.getElementById("score-total").textContent = totalCorrect + "/" + totalPossible + " · " + totalPercent + "%";
    document.getElementById("bonus-note").textContent = totalBonus ? ("Davon Bonuspunkte: " + totalBonus) : "";
    document.getElementById("reward-text").textContent = getReward(totalPercent, totalBonus);
    document.getElementById("profile-text").textContent = getProfile(active, totalPercent);
  }

  function showInfo(key) {
    document.getElementById("modal-title").textContent = names[key] || "Info";
    document.getElementById("modal-body").innerHTML = infos[key] || "";
    document.getElementById("modal").classList.add("open");
  }

  function closeInfo() {
    document.getElementById("modal").classList.remove("open");
  }

  // ========== EVENTS ==========
  function bindEvents() {
    document.querySelectorAll(".diff-btn").forEach(function (btn) {
      btn.addEventListener("click", function () {
        setDifficulty(btn.getAttribute("data-level"));
      });
    });

    document.getElementById("multiHintToggle").addEventListener("change", function () {
      showMultiHint = this.checked;
    });

    document.getElementById("cards").addEventListener("click", function (e) {
      var t = e.target;
      if (t.classList.contains("info-btn")) {
        showInfo(t.getAttribute("data-info"));
      }
      if (t.classList.contains("skip-btn") && t.getAttribute("data-skip")) {
        collapseCat(t.getAttribute("data-skip"));
      }
    });

    document.getElementById("restore-area").addEventListener("click", function (e) {
      var t = e.target;
      if (t.classList.contains("skip-btn") && t.getAttribute("data-expand")) {
        expandCat(t.getAttribute("data-expand"));
      }
    });

    document.getElementById("modal-close").addEventListener("click", closeInfo);
    document.getElementById("modal").addEventListener("click", function (e) {
      if (e.target === this) closeInfo();
    });
  }

  // ========== START ==========
  try {
    buildCards();
    bindEvents();
    loadAll();
    updateScores();
  } catch (err) {
    var box = document.getElementById("error-box");
    box.style.display = "block";
    box.textContent = "Fehler beim Laden: " + err.message;
    console.error(err);
  }
})();
</script>
</body>
</html>
